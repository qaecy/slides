<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cue-entity-list demo</title>

    <!-- Importmap must appear before any module scripts -->
    <!-- @qaecy/cue-sdk version: keep in sync with CUE_SDK_VERSION in js/cue-versions.js -->
    <script type="importmap">
      {
        "imports": {
          "@qaecy/cue-sdk": "https://esm.sh/@qaecy/cue-sdk@0.0.26",
          "firebase/": "https://esm.sh/firebase@12/"
        }
      }
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        color: #222;
        font-family: "Poppins", Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
      }

      body { display: flex; flex-direction: column; background: transparent !important; }

      /* Ensure the toolbar is visible before the custom element is defined */
      cue-sdk-toolbar { display: block; flex-shrink: 0; }

      /* ── Category bar (demo control, not part of component) ──── */
      #category-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: #18181b;
        border-top: 1px solid #3f3f46;
        border-radius: 6px;
        flex-shrink: 0;
        font-family: ui-monospace, 'Cascadia Code', monospace;
        font-size: 11px;
        color: #71717a;
      }

      #category-bar .sep {
        color: #3f3f46;
        user-select: none;
        margin: 0 1px;
      }

      #category-bar select {
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        min-width: 200px;
        max-width: 360px;
        outline: none;
      }
      #category-bar select:focus { border-color: #6366f1; }
      #category-bar select:disabled { opacity: 0.4; cursor: default; }

      #layout {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding-top: 8px;
      }

      #list-area {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: hidden;
      }

      cue-entity-list {
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>

    <!-- Auth toolbar -->
    <cue-sdk-toolbar id="toolbar"></cue-sdk-toolbar>

    <!-- Category selector bar — demo control, not part of cue-entity-list -->
    <div id="category-bar">
      <span>Category</span>
      <span class="sep">|</span>
      <select id="cat-select" disabled>
        <option value="">— sign in —</option>
      </select>
    </div>

    <div id="layout">
      <div id="list-area"></div>
    </div>

    <!-- SDK toolbar component -->
    <script type="module" src="../../../js/components/cue-sdk-toolbar.js"></script>

    <!-- Cue UI — version driven by js/cue-versions.js -->
    <script type="module">
      import { CUE_UI_VERSION } from '../../../js/cue-versions.js';
      // ?local or ?local=PORT loads from a local build server instead of CDN.
      // Run: cd /path/to/ui-components && npm run serve:webcomponents
      const localParam = new URLSearchParams(location.search).get('local');
      const localPort = localParam === '' || localParam === 'true' ? '4567' : localParam;
      const baseUrl = localPort
        ? `http://localhost:${localPort}`
        : `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}`;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `${baseUrl}/styles.css`;
      document.head.appendChild(link);
      const s = document.createElement('script');
      s.type = 'module';
      s.setAttribute('data-components', 'cue-entity-list');
      s.src = `${baseUrl}/index.js`;
      document.head.appendChild(s);
    </script>

    <script type="module">
      import { demoParam } from '../../../js/demo-params.js';
      import { CUE_MAPBOX_TOKEN } from '../../../js/cue-versions.js';
      import { CueProjectEntities } from '@qaecy/cue-sdk';

      const QCY     = 'https://dev.qaecy.com/ont#';
      const variant = demoParam('variant', 'none');

      const toolbar   = document.getElementById('toolbar');
      const catSelect = document.getElementById('cat-select');
      const listArea  = document.getElementById('list-area');

      let _cue             = null;
      let _projectId       = null;
      let _projectEntities = null;
      let _list            = null;

      // ── List element ──────────────────────────────────────────────────────

      async function _getOrCreateList(cue, entities) {
        if (_list) {
          _list.sdkState = { cue, entities };
          _list.iris     = [];
          return;
        }
        await customElements.whenDefined('cue-entity-list');
        const el = document.createElement('cue-entity-list');
        if (variant !== 'none') el.variant = variant;
        el.sdkState           = { cue, entities };
        el.iris               = [];
        el.mapboxToken        = CUE_MAPBOX_TOKEN;
        el.paginationPageSize = 20;
        listArea.appendChild(el);
        _list = el;
      }

      // ── Auth / project change ─────────────────────────────────────────────

      toolbar.addEventListener('projectchange', async (e) => {
        const { projectId, sdkState } = e.detail;
        _cue       = sdkState?.cue ?? null;
        _projectId = projectId;

        _resetSelect('Loading…', true);

        if (sdkState && projectId) {
          _projectEntities = new CueProjectEntities(_cue.api, projectId);
          await _getOrCreateList(_cue, _projectEntities);
          _fetchCategories();
        } else {
          _projectEntities = null;
          if (_list) { _list.sdkState = undefined; _list.iris = []; }
          _resetSelect('— sign in —', true);
        }
      });

      // ── Categories ────────────────────────────────────────────────────────

      async function _fetchCategories() {
        try {
          const all = await _projectEntities.contentCategoriesInProject(true);
          const cats = all.slice(0, 30);
          catSelect.innerHTML =
            '<option value="">— select category —</option>' +
            cats.map((c) => `<option value="${_esc(c.iri)}">${_esc(c.label)}</option>`).join('');
          catSelect.disabled = false;
        } catch (err) {
          console.error('[cue-entity-list demo] fetch categories:', err);
          _resetSelect('— no categories —', true);
        }
      }

      // ── Entities by category ──────────────────────────────────────────────

      catSelect.addEventListener('change', async () => {
        const iri = catSelect.value;
        if (!iri || !_list) return;
        _list.iris = [];
        const iris = await _fetchIris(iri);
        if (_list) _list.iris = iris;
      });

      async function _fetchIris(categoryIri) {
        if (!_cue || !_projectId) return [];
        const q = `PREFIX qcy: <${QCY}>
SELECT ?entity
WHERE {
  ?entity a qcy:CanonicalEntity ;
          qcy:hasEntityCategory <${categoryIri}> .
}
LIMIT 500`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          return (data.results?.bindings ?? [])
            .map((b) => b['entity']?.value ?? '')
            .filter(Boolean);
        } catch (err) {
          console.error('[cue-entity-list demo] fetch iris:', err);
          return [];
        }
      }

      // ── Helpers ───────────────────────────────────────────────────────────

      function _resetSelect(label, disabled) {
        catSelect.innerHTML = `<option value="">${_esc(label)}</option>`;
        catSelect.disabled  = disabled;
      }

      function _esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    </script>
  </body>
</html>
