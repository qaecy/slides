<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cue-document-list demo</title>

    <!-- Importmap must appear before any module scripts -->
    <!-- @qaecy/cue-sdk version: keep in sync with CUE_SDK_VERSION in js/cue-versions.js -->
    <script type="importmap">
      {
        "imports": {
          "@qaecy/cue-sdk": "https://esm.sh/@qaecy/cue-sdk@0.0.26",
          "firebase/": "https://esm.sh/firebase@12/"
        }
      }
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        color: #222;
        font-family: "Poppins", Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background: transparent !important;
      }

      /* Ensure the toolbar is visible before the custom element is defined */
      cue-sdk-toolbar { display: block; flex-shrink: 0; }

      /* ── File type bar (demo control, not part of component) ── */
      #filetype-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: #18181b;
        border-top: 1px solid #3f3f46;
        border-radius: 6px;
        flex-shrink: 0;
        font-family: ui-monospace, 'Cascadia Code', monospace;
        font-size: 11px;
        color: #71717a;
      }

      #filetype-bar .sep {
        color: #3f3f46;
        user-select: none;
        margin: 0 1px;
      }

      #filetype-bar select {
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        min-width: 160px;
        max-width: 300px;
        outline: none;
      }
      #filetype-bar select:focus    { border-color: #6366f1; }
      #filetype-bar select:disabled { opacity: 0.4; cursor: default; }

      #layout {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding-top: 8px;
      }

      #doc-list-mount {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      cue-document-list {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <!-- Auth toolbar -->
    <cue-sdk-toolbar id="toolbar" style="flex-shrink:0;"></cue-sdk-toolbar>

    <!-- File type filter bar — demo control, not part of cue-document-list -->
    <div id="filetype-bar">
      <span>File type</span>
      <span class="sep">|</span>
      <select id="suffix-select" disabled>
        <option value="">— sign in —</option>
      </select>
    </div>

    <div id="layout">
      <div id="doc-list-mount"></div>
    </div>

    <!-- SDK toolbar component -->
    <script type="module" src="../../../js/components/cue-sdk-toolbar.js"></script>

    <!-- Cue UI — version driven by js/cue-versions.js -->
    <script type="module">
      import { CUE_UI_VERSION } from '../../../js/cue-versions.js';
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/styles.css`;
      document.head.appendChild(link);
      const s = document.createElement('script');
      s.type = 'module';
      s.setAttribute('data-components', 'cue-document-list');
      s.src = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/index.js`;
      document.head.appendChild(s);
    </script>

    <script type="module">
      import { demoParam } from '../../../js/demo-params.js';

      const QCY = 'https://dev.qaecy.com/ont#';

      const pageSize     = demoParam('page-size', '25');
      const variant      = demoParam('variant',   'none');

      const toolbar      = document.getElementById('toolbar');
      const suffixSelect = document.getElementById('suffix-select');
      const mount        = document.getElementById('doc-list-mount');

      let _cue       = null;
      let _projectId = null;
      let _docList   = null;

      // ── Doc list element ──────────────────────────────────────────────────

      function _getOrCreateDocList(projectId, sdkState) {
        if (!_docList) {
          const el = document.createElement('cue-document-list');
          el.setAttribute('page-size', pageSize);
          el.setAttribute('prefetch-pages', '2');
          if (variant !== 'none') el.setAttribute('variant', variant);
          el.projectId = projectId;
          el.sdkState  = sdkState;
          el.uuids     = [];
          mount.appendChild(el);
          _docList = el;
        } else {
          _docList.projectId = projectId;
          _docList.sdkState  = sdkState;
          _docList.uuids     = [];
        }
        return _docList;
      }

      // ── Auth / project change ─────────────────────────────────────────────

      toolbar.addEventListener('projectchange', async (e) => {
        const { projectId, sdkState } = e.detail;
        _cue       = sdkState?.cue ?? null;
        _projectId = projectId;

        _resetSelect('Loading…', true);

        if (sdkState && projectId) {
          _getOrCreateDocList(projectId, sdkState);
          _fetchSuffixes();
        } else {
          if (_docList) { _docList.projectId = undefined; _docList.sdkState = undefined; _docList.uuids = []; }
          _resetSelect('— sign in —', true);
        }
      });

      // ── Suffixes ──────────────────────────────────────────────────────────

      async function _fetchSuffixes() {
        if (!_cue || !_projectId) return;
        const q = `PREFIX qcy: <${QCY}>
SELECT ?ext (COUNT(*) AS ?docCount)
WHERE {
  SELECT DISTINCT ?fc ?ext WHERE {
    ?fc a qcy:FileContent ;
        qcy:hasFileLocation/qcy:suffix ?ext .
    FILTER NOT EXISTS { ?x qcy:alternativeRepresentation ?fc }
  }
}
GROUP BY ?ext
ORDER BY DESC(?docCount)`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          const items = (data.results?.bindings ?? [])
            .map((b) => ({ suffix: b['ext']?.value ?? '', count: parseInt(b['docCount']?.value ?? '0', 10) }))
            .filter((i) => i.suffix);
          suffixSelect.innerHTML =
            '<option value="">— all files —</option>' +
            items.map((i) => `<option value="${_esc(i.suffix)}">${_esc(i.suffix)} (${i.count})</option>`).join('');
          suffixSelect.disabled = false;
        } catch (err) {
          console.error('[cue-document-list demo] fetch suffixes:', err);
          _resetSelect('— no file types —', true);
        }
      }

      suffixSelect.addEventListener('change', async () => {
        const suffix = suffixSelect.value;
        if (!suffix) { if (_docList) _docList.uuids = []; return; }
        await _fetchByExtension(suffix);
      });

      async function _fetchByExtension(suffix) {
        if (!_cue || !_projectId) return;
        const esc = suffix.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        const q = `PREFIX qcy: <${QCY}>
SELECT ?id
WHERE {
  ?fc a qcy:FileContent ;
      qcy:hasFileLocation/qcy:suffix "${esc}" .
  FILTER NOT EXISTS { ?x qcy:alternativeRepresentation ?fc }
  BIND(REPLACE(STR(?fc), "^.*/([^/]*)$", "$1") AS ?id)
}`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          if (_docList) {
            _docList.uuids = (data.results?.bindings ?? [])
              .map((b) => b['id']?.value ?? '')
              .filter(Boolean);
          }
        } catch (err) {
          console.error('[cue-document-list demo] fetch uuids:', err);
        }
      }

      // ── Helpers ───────────────────────────────────────────────────────────

      function _resetSelect(label, disabled) {
        suffixSelect.innerHTML = `<option value="">${_esc(label)}</option>`;
        suffixSelect.disabled  = disabled;
      }

      function _esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    </script>
  </body>
</html>
