<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cue-entity-viewer demo</title>

    <!-- Importmap must appear before any module scripts -->
    <!-- @qaecy/cue-sdk version: keep in sync with CUE_SDK_VERSION in js/cue-versions.js -->
    <script type="importmap">
      {
        "imports": {
          "@qaecy/cue-sdk": "https://esm.sh/@qaecy/cue-sdk@0.0.26",
          "firebase/": "https://esm.sh/firebase@12/"
        }
      }
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        color: #222;
        font-family: "Poppins", Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
      }

      body { display: flex; flex-direction: column; background: transparent !important; }

      /* Ensure the toolbar is visible before the custom element is defined */
      cue-sdk-toolbar { display: block; flex-shrink: 0; }

      /* ── Entity selector bar (demo control, not part of component) ── */
      #entity-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: #18181b;
        border-top: 1px solid #3f3f46;
        border-radius: 6px;
        flex-shrink: 0;
        font-family: ui-monospace, 'Cascadia Code', monospace;
        font-size: 11px;
        color: #71717a;
      }

      #entity-bar .sep {
        color: #3f3f46;
        user-select: none;
        margin: 0 1px;
      }

      #entity-bar select {
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        min-width: 160px;
        max-width: 300px;
        outline: none;
      }
      #entity-bar select:focus   { border-color: #6366f1; }
      #entity-bar select:disabled { opacity: 0.4; cursor: default; }

      #layout {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding-top: 8px;
      }

      #viewer-area {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      cue-entity-viewer {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <!-- Auth toolbar -->
    <cue-sdk-toolbar id="toolbar"></cue-sdk-toolbar>

    <!-- Entity selector bar — demo control, not part of cue-entity-viewer -->
    <div id="entity-bar">
      <span>Category</span>
      <span class="sep">|</span>
      <select id="cat-select" disabled>
        <option value="">— sign in —</option>
      </select>
      <span class="sep">|</span>
      <span>Entity</span>
      <span class="sep">|</span>
      <select id="entity-select" disabled>
        <option value="">— select category —</option>
      </select>
    </div>

    <div id="layout">
      <div id="viewer-area"></div>
    </div>

    <!-- SDK toolbar component -->
    <script type="module" src="../../../js/components/cue-sdk-toolbar.js"></script>

    <!-- Cue UI — version driven by js/cue-versions.js -->
    <script type="module">
      import { CUE_UI_VERSION } from '../../../js/cue-versions.js';
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/styles.css`;
      document.head.appendChild(link);
      const s = document.createElement('script');
      s.type = 'module';
      s.setAttribute('data-components', 'cue-entity-viewer');
      s.src = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/index.js`;
      document.head.appendChild(s);
    </script>

    <script type="module">
      import { demoParam } from '../../../js/demo-params.js';
      import { CUE_MAPBOX_TOKEN } from '../../../js/cue-versions.js';
      import { CueProjectEntities } from '@qaecy/cue-sdk';

      const QCY     = 'https://dev.qaecy.com/ont#';
      const variant = demoParam('variant', 'none');

      const toolbar      = document.getElementById('toolbar');
      const catSelect    = document.getElementById('cat-select');
      const entitySelect = document.getElementById('entity-select');
      const viewerArea   = document.getElementById('viewer-area');

      let _cue             = null;
      let _projectId       = null;
      let _projectEntities = null;
      let _viewer          = null;

      // ── Viewer element ────────────────────────────────────────────────────

      async function _getOrCreateViewer(cue, projectId) {
        if (_viewer) {
          _viewer.cue       = cue;
          _viewer.projectId = projectId;
          _viewer.iri       = undefined;
          return;
        }
        await customElements.whenDefined('cue-entity-viewer');
        const el = document.createElement('cue-entity-viewer');
        if (variant !== 'none') el.setAttribute('variant', variant);
        el.cue        = cue;
        el.projectId  = projectId;
        el.mapboxToken = CUE_MAPBOX_TOKEN;
        viewerArea.appendChild(el);
        _viewer = el;
      }

      // ── Auth / project change ─────────────────────────────────────────────

      toolbar.addEventListener('projectchange', async (e) => {
        const { projectId, sdkState } = e.detail;
        _cue       = sdkState?.cue ?? null;
        _projectId = projectId;

        _resetSelect(catSelect,    '— loading… —', true);
        _resetSelect(entitySelect, '— select category —', true);

        if (sdkState && projectId) {
          _projectEntities = new CueProjectEntities(_cue.api, projectId);
          await _getOrCreateViewer(_cue, projectId);
          _fetchCategories();
        } else {
          _projectEntities = null;
          if (_viewer) { _viewer.cue = undefined; _viewer.projectId = undefined; _viewer.iri = undefined; }
          _resetSelect(catSelect, '— sign in —', true);
        }
      });

      // ── Categories ────────────────────────────────────────────────────────

      async function _fetchCategories() {
        try {
          const all = await _projectEntities.contentCategoriesInProject(true);
          const cats = all.slice(0, 30);
          catSelect.innerHTML =
            '<option value="">— select category —</option>' +
            cats.map((c) => `<option value="${_esc(c.iri)}">${_esc(c.label)}</option>`).join('');
          catSelect.disabled = false;
        } catch (err) {
          console.error('[cue-entity-viewer demo] fetch categories:', err);
          _resetSelect(catSelect, '— no categories —', true);
        }
      }

      catSelect.addEventListener('change', async () => {
        const iri = catSelect.value;
        _resetSelect(entitySelect, iri ? '— loading… —' : '— select category —', true);
        if (!iri) return;
        const items = await _fetchEntities(iri);
        if (!items.length) {
          _resetSelect(entitySelect, '— none found —', true);
          return;
        }
        entitySelect.innerHTML =
          '<option value="">— select entity —</option>' +
          items.map((e) => `<option value="${_esc(e.iri)}">${_esc(e.label || _shortIri(e.iri))}</option>`).join('');
        entitySelect.disabled = false;
      });

      // ── Entities by category ──────────────────────────────────────────────

      async function _fetchEntities(categoryIri) {
        if (!_cue || !_projectId) return [];
        const q = `PREFIX qcy: <${QCY}>
SELECT ?entity ?value
WHERE {
  ?entity a qcy:CanonicalEntity ;
          qcy:hasEntityCategory <${categoryIri}> ;
          qcy:value ?value .
}
LIMIT 30`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          return (data.results?.bindings ?? [])
            .map((b) => ({ iri: b['entity']?.value ?? '', label: b['value']?.value ?? '' }))
            .filter((e) => e.iri);
        } catch (err) {
          console.error('[cue-entity-viewer demo] fetch entities:', err);
          return [];
        }
      }

      entitySelect.addEventListener('change', () => {
        const iri = entitySelect.value;
        if (_viewer && iri) _viewer.iri = iri;
      });

      // ── Helpers ───────────────────────────────────────────────────────────

      function _resetSelect(sel, label, disabled) {
        sel.innerHTML = `<option value="">${_esc(label)}</option>`;
        sel.disabled  = disabled;
      }

      function _shortIri(iri) { return iri.split('/').pop() ?? iri; }

      function _esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    </script>
  </body>
</html>
