<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cue-document-viewer demo</title>

    <!-- Importmap must appear before any module scripts -->
    <!-- @qaecy/cue-sdk version: keep in sync with CUE_SDK_VERSION in js/cue-versions.js -->
    <script type="importmap">
      {
        "imports": {
          "@qaecy/cue-sdk": "https://esm.sh/@qaecy/cue-sdk@0.0.26",
          "firebase/": "https://esm.sh/firebase@12/"
        }
      }
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        color: #222;
        font-family: "Poppins", Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
      }

      body { display: flex; flex-direction: column; background: transparent !important; }

      /* Ensure the toolbar is visible before the custom element is defined */
      cue-sdk-toolbar { display: block; flex-shrink: 0; }

      /* ── Document selector bar (demo control, not part of component) ── */
      #doc-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        background: #18181b;
        border-top: 1px solid #3f3f46;
        border-radius: 6px;
        flex-shrink: 0;
        font-family: ui-monospace, 'Cascadia Code', monospace;
        font-size: 11px;
        color: #71717a;
      }

      #doc-bar .sep {
        color: #3f3f46;
        user-select: none;
        margin: 0 1px;
      }

      #doc-bar select {
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        min-width: 160px;
        max-width: 300px;
        outline: none;
      }
      #doc-bar select:focus    { border-color: #6366f1; }
      #doc-bar select:disabled { opacity: 0.4; cursor: default; }

      #layout {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding-top: 8px;
      }

      #viewer-area {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      cue-document-viewer {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <!-- Auth toolbar -->
    <cue-sdk-toolbar id="toolbar"></cue-sdk-toolbar>

    <!-- Document selector bar — demo control, not part of cue-document-viewer -->
    <div id="doc-bar">
      <span>File type</span>
      <span class="sep">|</span>
      <select id="suffix-select" disabled>
        <option value="">— sign in —</option>
      </select>
      <span class="sep">|</span>
      <span>File</span>
      <span class="sep">|</span>
      <select id="file-select" disabled>
        <option value="">— select file type —</option>
      </select>
    </div>

    <div id="layout">
      <div id="viewer-area"></div>
    </div>

    <!-- SDK toolbar component -->
    <script type="module" src="../../../js/components/cue-sdk-toolbar.js"></script>

    <!-- Cue UI — version driven by js/cue-versions.js -->
    <script type="module">
      import { CUE_UI_VERSION } from '../../../js/cue-versions.js';
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/styles.css`;
      document.head.appendChild(link);
      const s = document.createElement('script');
      s.type = 'module';
      s.setAttribute('data-components', 'cue-document-viewer');
      s.src = `https://cdn.jsdelivr.net/npm/@qaecy/cue-ui@${CUE_UI_VERSION}/index.js`;
      document.head.appendChild(s);
    </script>

    <script type="module">
      import { demoParam } from '../../../js/demo-params.js';

      const QCY     = 'https://dev.qaecy.com/ont#';
      const variant = demoParam('variant', 'none');

      const toolbar      = document.getElementById('toolbar');
      const suffixSelect = document.getElementById('suffix-select');
      const fileSelect   = document.getElementById('file-select');
      const viewerArea   = document.getElementById('viewer-area');

      let _cue       = null;
      let _projectId = null;
      let _viewer    = null;

      // ── Viewer element ────────────────────────────────────────────────────

      async function _getOrCreateViewer(cue, projectId) {
        if (_viewer) {
          _viewer.cue       = cue;
          _viewer.projectId = projectId;
          _viewer.uuid      = undefined;
          return;
        }
        await customElements.whenDefined('cue-document-viewer');
        const el = document.createElement('cue-document-viewer');
        if (variant !== 'none') el.variant = variant;
        el.cue             = cue;
        el.projectId       = projectId;
        el.showDocumentInfo = true;
        viewerArea.appendChild(el);
        _viewer = el;
      }

      // ── Auth / project change ─────────────────────────────────────────────

      toolbar.addEventListener('projectchange', async (e) => {
        const { projectId, sdkState } = e.detail;
        _cue       = sdkState?.cue ?? null;
        _projectId = projectId;

        _resetSelect(suffixSelect, 'Loading…', true);
        _resetSelect(fileSelect,   '— select file type —', true);

        if (sdkState && projectId) {
          await _getOrCreateViewer(_cue, projectId);
          _fetchSuffixes();
        } else {
          if (_viewer) { _viewer.cue = undefined; _viewer.projectId = undefined; _viewer.uuid = undefined; }
          _resetSelect(suffixSelect, '— sign in —', true);
        }
      });

      // ── Suffixes ──────────────────────────────────────────────────────────

      async function _fetchSuffixes() {
        if (!_cue || !_projectId) return;
        const q = `PREFIX qcy: <${QCY}>
SELECT ?ext (COUNT(*) AS ?docCount)
WHERE {
  SELECT DISTINCT ?fc ?ext WHERE {
    ?fc a qcy:FileContent ;
        qcy:hasFileLocation/qcy:suffix ?ext .
    FILTER NOT EXISTS { ?x qcy:alternativeRepresentation ?fc }
  }
}
GROUP BY ?ext
ORDER BY DESC(?docCount)`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          const items = (data.results?.bindings ?? [])
            .map((b) => ({ suffix: b['ext']?.value ?? '', count: parseInt(b['docCount']?.value ?? '0', 10) }))
            .filter((i) => i.suffix);
          suffixSelect.innerHTML =
            '<option value="">— select file type —</option>' +
            items.map((i) => `<option value="${_esc(i.suffix)}">${_esc(i.suffix)} (${i.count})</option>`).join('');
          suffixSelect.disabled = false;
        } catch (err) {
          console.error('[cue-document-viewer demo] fetch suffixes:', err);
          _resetSelect(suffixSelect, '— no file types —', true);
        }
      }

      suffixSelect.addEventListener('change', async () => {
        const suffix = suffixSelect.value;
        _resetSelect(fileSelect, suffix ? '— loading… —' : '— select file type —', true);
        if (!suffix) return;
        const files = await _fetchFiles(suffix);
        if (!files.length) { _resetSelect(fileSelect, '— none found —', true); return; }
        fileSelect.innerHTML =
          '<option value="">— select file —</option>' +
          files.map((f) => `<option value="${_esc(f.uuid)}">${_esc(_shortPath(f.path || f.uuid))}</option>`).join('');
        fileSelect.disabled = false;
      });

      // ── Files by suffix ───────────────────────────────────────────────────

      async function _fetchFiles(suffix) {
        if (!_cue || !_projectId) return [];
        const escaped = suffix.replace(/"/g, '\\"');
        const q = `PREFIX qcy: <${QCY}>
SELECT ?id (SAMPLE(?fp) AS ?path)
WHERE {
  ?fc a qcy:FileContent ;
      qcy:hasFileLocation ?loc .
  ?loc qcy:suffix "${escaped}" ;
       qcy:filePath ?fp .
  FILTER NOT EXISTS { ?x qcy:alternativeRepresentation ?fc }
  BIND(REPLACE(STR(?fc), "^.*/([^/]*)$", "$1") AS ?id)
}
GROUP BY ?id
LIMIT 30`;
        try {
          const data = await _cue.api.sparql(q, _projectId);
          return (data.results?.bindings ?? [])
            .map((b) => ({ uuid: b['id']?.value ?? '', path: b['path']?.value ?? '' }))
            .filter((f) => f.uuid);
        } catch (err) {
          console.error('[cue-document-viewer demo] fetch files:', err);
          return [];
        }
      }

      fileSelect.addEventListener('change', () => {
        const uuid = fileSelect.value;
        if (_viewer && uuid) _viewer.uuid = uuid;
      });

      // ── Helpers ───────────────────────────────────────────────────────────

      function _resetSelect(sel, label, disabled) {
        sel.innerHTML = `<option value="">${_esc(label)}</option>`;
        sel.disabled  = disabled;
      }

      function _shortPath(path) {
        return path.replace(/\\/g, '/').split('/').pop() || path;
      }

      function _esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    </script>
  </body>
</html>
